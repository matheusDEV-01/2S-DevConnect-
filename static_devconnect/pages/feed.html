<!DOCTYPE html>
<html lang="pt-BR">
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matheus Felix Coura">
    <meta name="description" content="Site de empresa DevConnect">

    <title>Feed - DevConnect</title>

    <link rel="shortcut icon" href="../images/logo-devconnect-sm.svg" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/feed.css">

</head>

<body>
    <h1>Tela Feed - DevConnect</h1>
    <!-- Inicio Header -->
    <header id="cabecalho">
        <nav>
            <a id="logo-desktop" href="../pages/feed.html">
                <img src="../images/logo-devconnect-md.svg" alt="Logo da empresa">
            </a>

            <a id="logo-mobile" href="../pages/feed.html">
                <img src="../images/logo-devconnect-sm.svg" alt="Logo da empresa">
            </a>

            <!-- icones -->
            <div class="cabecalho-acoes">

                <a href="./feed.html">
                    <img src="../images/Vector.svg" alt="">
                </a>

                <a href="#">
                    <img src="../images/Vector 1.svg" alt="">
                </a>

                <a href="#">
                    <img class="foto-perfil" src="../images/images (1).webp" alt="Foto de perfil">
                </a>


            </div>
        </nav>
    </header>
    <!-- Inicio Main -->
    <main>
        <div class="container-flex-publi">
            <!-- Inicio Storys -->
            <section id="storys" class="estilo-formulario">
                <article class="card-story">
                    <a href="#">
                        <img src="../images/Felca.jpg" alt="foto de perfil">
                        <span>Felca</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/calleri.jpg" alt="foto de perfil">
                        <span>Calleri</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/kamylinha.jpg" alt="foto de perfil">
                        <span>kamylinha</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/hytalo.jpg" alt="foto de perfil">
                        <span>Hytalo</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/lucas.webp" alt="foto de perfil">
                        <span>Lucas</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/Tapia.jpg" alt="foto de perfil">
                        <span>Tapia</span>
                    </a>
                </article>

                <article class="card-story">
                    <a href="#">
                        <img src="../images/rafael.jpg" alt="foto de perfil">
                        <span>Rafael</span>
                    </a>
                </article>

            </section>
            <!-- Fim Storys -->

            <!-- inicio cadastro publi -->
            <section id="cadastro-publi" class="estilo-formulario">
                <h2>Publicação</h2>
                <form action="">
                    <textarea name="" id="" placeholder="Digite a descrição do post...."></textarea>
                    <footer>

                        <div>
                            <label for="upload" class="file-upload">Faça upload da sua imagem aqui...</label>
                            <input type="file" id="upload" hidden>
                        </div>

                        <button type="text" class="Formulario-botao">Postar</button>
                    </footer>

                </form>

            </section>
            <!-- Fim cadastro publi -->

            <section id="publicacoes">
                <!-- Inicio card publicaçção -->
                <article class="card-publi">

                    <header>
                        <a href="#">
                            <img class="foto-perfil" src="../images/Felca.jpg" alt="">
                            Felca
                        </a>
                    </header>

                    <figure>
                        <img class="imagem-publicacao" src="../images/hytalo.jpg" alt="">


                        <figcaption class="descricao-publicacao">
                            Felca
                            <p>influenciador Hytalo Santos </p>
                        </figcaption>

                        <div class="interacoes-publicacao">
                            <button>
                                <img src="../images/icone-coracao-preto.svg" alt="">
                            </button>
                            <button>
                                <img src="../images/icone-comentario-preto.svg" alt="">
                            </button>

                            <span>150 curtidas</span>

                        </div>
                    </figure>

                    <button type="button">Ver mais comentario....  </button>

                </article>
                <!-- Fim do card publicaçção -->
            </section>

        </div>

    </main>
    <!-- Fim Main -->
</body>
